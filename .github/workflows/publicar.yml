name: Publicar version

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  construir:
    runs-on: windows-latest
    env:
      ETIQUETA: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pyinstaller pywebview

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -t . -v

      - name: Poner el numero de version en el programa
        run: python poner_version.py "$env:ETIQUETA"

      - name: Compilar el programa
        run: >
          pyinstaller --onefile --windowed --clean
          --name Projections_Dream
          --icon Proyecciones_Dream.ico
          --add-data "Proyecciones_Dream.ico;."
          --add-data "web;web"
          --collect-all webview
          --collect-all pythonnet
          --collect-all clr_loader
          app_web.py

      - name: Probar que la ventana abre y dibuja el panel
        shell: pwsh
        run: |
          $datos = Join-Path $env:RUNNER_TEMP "prueba_datos.json"
          $res = Join-Path $env:RUNNER_TEMP "prueba_resultado.txt"
          $p = Start-Process -FilePath "dist/Projections_Dream.exe" -ArgumentList "--datos","`"$datos`"","--autoprueba=`"$res`"" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error "La ventana no respondio en 2 minutos."; exit 1 }
          if (Test-Path $res) { Get-Content $res }
          if ($p.ExitCode -ne 0) { Write-Error "La prueba de la ventana fallo."; exit 1 }

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Crear el instalador
        run: |
          $version = $env:ETIQUETA.TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" instalador.iss

      - name: Publicar la version en GitHub
        run: |
          $archivo = "Output/Projections_Dream_Setup.exe"
          gh release view "$env:ETIQUETA" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:ETIQUETA" $archivo --clobber
          } else {
            gh release create "$env:ETIQUETA" $archivo --title "Version $env:ETIQUETA" --generate-notes
          }
